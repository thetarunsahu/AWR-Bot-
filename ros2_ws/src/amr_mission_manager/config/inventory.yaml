# SIH26112 demo inventory aligned with the Gazebo warehouse.
# The AMR now spawns at world/map origin, so these are direct warehouse
# coordinates. Each rack pose is an aisle-side approach point, not the rack
# centre, preventing Nav2 from planning into collision geometry.
items:
  SKU001:
    name: "Laptop"
    rack: "RACK_A"
  SKU002:
    name: "Keyboard"
    rack: "RACK_B"
  SKU003:
    name: "Mouse"
    rack: "RACK_C"
  SKU004:
    name: "Monitor"
    rack: "RACK_D"
  SKU005:
    name: "USB Cable"
    rack: "RACK_E"
  SKU006:
    name: "Power Adapter"
    rack: "RACK_F"
  SKU007:
    name: "Barcode Scanner"
    rack: "RACK_A"
  SKU008:
    name: "Label Printer"
    rack: "RACK_C"
  SKU009:
    name: "Packing Tape"
    rack: "RACK_E"
  SKU010:
    name: "Shipping Box"
    rack: "RACK_F"

racks:
  # Upper row: approach from the south aisle, face north.
  RACK_A:
    x: -7.0
    y: 2.7
    yaw: 1.5707963267948966
  RACK_B:
    x: 0.0
    y: 2.7
    yaw: 1.5707963267948966
  RACK_C:
    x: 7.0
    y: 2.7
    yaw: 1.5707963267948966

  # Lower row: approach from the north aisle, face south.
  RACK_D:
    x: -7.0
    y: -2.2
    yaw: -1.5707963267948966
  RACK_E:
    x: 0.0
    y: -2.2
    yaw: -1.5707963267948966
  RACK_F:
    x: 7.0
    y: -2.2
    yaw: -1.5707963267948966

  # Final destination inside the green packing-zone marker.
  PACKING_ZONE:
    x: 9.0
    y: -7.5
    yaw: 0.0
